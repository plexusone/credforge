site_name: credforge
site_description: Check a credential registry against the stores and workflows it names, without reading any value
site_url: https://plexusone.github.io/credforge/
repo_url: https://github.com/plexusone/credforge
repo_name: plexusone/credforge

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.svg
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

hooks:
  - hooks/strip_binaries.py

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Design:
      - Product Requirements: specs/initiatives/INIT-CREDFORGE-001/PRD.md
      - Technical Requirements: specs/initiatives/INIT-CREDFORGE-001/TRD.md
      - Plan: specs/initiatives/INIT-CREDFORGE-001/PLAN.md
      - Roadmap: specs/initiatives/INIT-CREDFORGE-001/ROADMAP.md
  - Releases:
      - Changelog: releases/changelog.md
      - v0.11.1: releases/v0.11.1.md
      - v0.11.0: releases/v0.11.0.md
      - v0.10.0: releases/v0.10.0.md
      - v0.9.1: releases/v0.9.1.md
      - v0.9.0: releases/v0.9.0.md
      - v0.8.0: releases/v0.8.0.md
      - v0.7.0: releases/v0.7.0.md
      - v0.6.0: releases/v0.6.0.md
      - v0.5.0: releases/v0.5.0.md
      - v0.4.0: releases/v0.4.0.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/credforge
